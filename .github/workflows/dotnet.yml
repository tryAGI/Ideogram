name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      auto-stable-release: true
      project-path: src/libs/Ideogram/Ideogram.csproj
      dotnet-version: 10.0.x
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  api-versions-nativeaot:
    name: Offline API versions NativeAOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate generation guards without network
        run: python3 scripts/test-generation.py
      - name: Publish offline API versions fixture
        run: dotnet publish src/tests/ApiVersions.NativeAotSmoke/ApiVersions.NativeAotSmoke.csproj -c Release -r linux-x64 -o artifacts/api-versions-aot
      - name: Exercise both clients without provider calls
        run: ./artifacts/api-versions-aot/ApiVersions.NativeAotSmoke

  # Fails in seconds when the nuget.org trusted-publishing policy is missing or no longer matches, rather
  # than letting the whole build run and surfacing the mismatch as an HTTP 401 at the push. It declares no
  # `needs`, so it runs beside the build instead of after it, and it has to stay in this workflow for the
  # same reason the push does: nuget.org matches the policy against job_workflow_ref.
  nuget-trusted-publish-check:
    name: Check NuGet trusted publishing
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-trusted-publish-check@main
        with:
          user: havendv

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
